  const t = parseInt(r[0]);
  const tb = parseFloat(r[2]);
  // Filter out anomalous spikes (outside realistic range)
  if (tb < 0 || tb > 750) return;
  labels.push(t);
  temp.push(parseFloat(tb.toFixed(2)));
});

const refData = labels.map(() => 600);

const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
const tickColor = isDark ? '#aaa' : '#555';

new Chart(document.getElementById('tempChart'), {
  type: 'line',
  data: {
    labels,
    datasets: [
      {
        label: 'Temperatura',
        data: temp,
        borderColor: '#4575b4',
        backgroundColor: 'transparent',
        borderWidth: 1.5,
        pointRadius: 0,
        tension: 0.2,
        order: 1
      },
      {
        label: 'Referência 600 °C',
        data: refData,
        borderColor: '#2ca02c',
        backgroundColor: 'transparent',
        borderWidth: 1.5,
        borderDash: [10, 4],
        pointRadius: 0,
        tension: 0,
        order: 0
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        mode: 'index',
        intersect: false,
        backgroundColor: isDark ? '#222' : '#fff',
        borderColor: isDark ? '#444' : '#ccc',
        borderWidth: 1,
        titleColor: isDark ? '#eee' : '#333',
        bodyColor: isDark ? '#bbb' : '#555',
        callbacks: {
          title: items => `t = ${items[0].label} s`,
          label: item => `${item.dataset.label}: ${item.parsed.y.toFixed(1)} °C`
        }
      }
    },
    scales: {
      x: {
        type: 'linear',
        title: {
          display: true,
          text: 'Tempo (s)',
          color: tickColor,
          font: { size: 13 }
        },
        ticks: { color: tickColor, maxTicksLimit: 12 },
        grid: { color: gridColor }
      },
      y: {
        title: {
          display: true,
          text: 'Temperatura (°C)',
          color: tickColor,
          font: { size: 13 }
        },
        ticks: { color: tickColor, callback: v => v + ' °C' },
        grid: { color: gridColor },
        min: 0,
        max: 700
      }
    }
  }
});
</script>
